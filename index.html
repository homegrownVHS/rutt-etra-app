<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rutt-Etra Live + MIDI</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      max-width: 1280px;
      width: 98vw;
    }
    #row1, #row2, #row3 { /* Added #row3 for new shader controls */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px; /* Add some space between rows */
    }
    .control-group {
      display: flex;
      flex-direction: column;
      min-width: 150px;
      max-width: 220px;
    }
    label {
      margin-bottom: 4px;
    }
    input[type="range"],
    select,
    input[type="color"],
    input[type="file"],
    input[type="number"] { /* Added number type */
      width: 100%;
    }
    input[type="file"] {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px;
    }
    button {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 6px;
    }
    button:hover {
      background: #666;
    }
    h3 {
      width: 100%;
      text-align: center;
      margin-bottom: 5px;
      color: #eee;
    }
  </style>
</head>
<body>
  <main></main>

  <div id="controls">
    <div id="row1">
      <div class="control-group">
        <label for="camSelect">Camera Source</label>
        <select id="camSelect"></select>
      </div>

      <div class="control-group">
        <label>Depth Range <span id="depthLabel">0</span></label>
        <input type="range" id="depthSlider" min="-100" max="100" value="0">
        <label><input type="checkbox" id="lfoDepth"> LFO</label>
      </div>

      <div class="control-group">
        <label>Tilt Angle X <span id="tiltXLabel">0°</span></label>
        <input type="range" id="tiltXSlider" min="-180" max="180" value="0">
        <label><input type="checkbox" id="lfoTiltX"> LFO</label>
      </div>

      <div class="control-group">
        <label>Tilt Angle Y <span id="tiltYLabel">0°</span></label>
        <input type="range" id="tiltYSlider" min="-180" max="180" value="0">
        <label><input type="checkbox" id="lfoTiltY"> LFO</label>
      </div>

      <div class="control-group">
        <label>Scale <span id="scaleLabel">1.00</span></label>
        <input type="range" id="scaleSlider" min="0.5" max="3" step="0.1" value="1">
        <label><input type="checkbox" id="lfoScale"> LFO</label>
      </div>

      <div class="control-group">
        <label>Density <span id="densityLabel">6</span></label>
        <input type="range" id="densitySlider" min="1" max="10" value="1">
      </div>

      <div class="control-group">
        <label for="gammaSlider">Gamma: <span id="gammaLabel">2.2</span></label>
        <input type="range" id="gammaSlider" min="0.1" max="5" value="1.0" step="0.1">
      </div>
      <div class="control-group">
        <label for="shapeXSlider">Shape X: <span id="shapeXLabel">0.0</span></label>
        <input type="range" id="shapeXSlider" min="-5" max="5" value="0" step="0.1">
        <label><input type="checkbox" id="lfoShapeX"> LFO</label>
      </div>

      <div class="control-group">
        <label for="shapeYSlider">Shape Y: <span id="shapeYLabel">0.0</span></label>
        <input type="range" id="shapeYSlider" min="-10" max="10" value="0" step="0.1">
        <label><input type="checkbox" id="lfoShapeY"> LFO</label>
      </div>

      <div class="control-group">
          <label for="waveAmpSlider">Wave Amplitude: <span id="waveAmpLabel">0.0</span></label>
          <input type="range" id="waveAmpSlider" min="-200" max="200" value="0" step="1">
          <label><input type="checkbox" id="lfoWaveAmp"> LFO</label>
      </div>
      <div class="control-group">
          <label for="waveFreqSlider">Wave Frequency: <span id="waveFreqLabel">0.0</span></label>
          <input type="range" id="waveFreqSlider" min="0" max="20" value="0" step="0.1">
          <label><input type="checkbox" id="lfoWaveFreq"> LFO</label>
      </div>

      <div class="control-group">
        <label for="horizAmpSlider">Horizontal Amp: <span id="horizAmpLabel">1.0</span></label>
        <input type="range" id="horizAmpSlider" min="0" max="2" value="1" step="0.01">
        <label><input type="checkbox" id="lfoHorizAmp"> LFO</label>
      </div>

      <div class="control-group">
        <label for="vertAmpSlider">Vertical Amp: <span id="vertAmpLabel">1.0</span></label>
        <input type="range" id="vertAmpSlider" min="0" max="2" value="1" step="0.01">
        <label><input type="checkbox" id="lfoVertAmp"> LFO</label>
      </div>

      <div class="control-group">
        <label for="offsetXSlider">Offset X: <span id="offsetXLabel">0</span></label>
        <input type="range" id="offsetXSlider" min="-300" max="300" value="0" step="1">
        <label><input type="checkbox" id="lfoOffsetX"> LFO</label>
      </div>

      <div class="control-group">
        <label for="offsetYSlider">Offset Y: <span id="offsetYLabel">0</span></label>
        <input type="range" id="offsetYSlider" min="-300" max="300" value="0" step="1">
        <label><input type="checkbox" id="lfoOffsetY"> LFO</label>
      </div>
      
      <div class="control-group">
        <button id="sequenceToggleButton">Start Sequence</button>
      </div>
      </div>

    <div id="row2">
      <div class="control-group">
        <label>LFO Type</label>
        <select id="lfoType">
          <option value="saw">Sawtooth</option>
          <option value="sin">Sine</option>
          <option value="tri">Triangle</option>
        </select>
      </div>

      <div class="control-group">
        <label>LFO Freq</label>
        <input type="range" id="lfoFreq" min="0.01" max="2" step="0.01" value="0.3">
      </div>

      <div class="control-group">
        <label>LFO Amp</label>
        <input type="range" id="lfoAmp" min="0" max="1" step="0.01" value="0.5">
      </div>

      <div class="control-group">
        <label>Upload Image</label>
        <input type="file" id="imgInput" accept="image/*">
      </div>
      <div class="control-group">
        <label>Upload Video</label>
        <input type="file" id="vidInput" accept="video/*">
      </div>
      <div class="control-group">
        <button id="downloadBtn">Download Image</button>
      </div>

      <div class="control-group">
        <label for="totalFramesForExportInput">Total Export Frames</label>
        <input type="number" id="totalFramesForExportInput" value="100" min="1" max="9999">
      </div>
      <div class="control-group">
        <button id="startExportBtn">Start Export</button>
      </div>
      <div class="control-group">
        <button id="nextFrameBtn">Next Frame</button>
        <label>Current Frame: <span id="currentFrameLabel">0</span></label>
      </div>
      
      <input type="hidden" id="currentFrameForExportInput" value="0">
    </div>

    <div id="row3"> <h3>Shader Post-Processing</h3>
      <div class="control-group">
          <label for="blurRadiusSlider">Blur Radius: <span id="blurRadiusLabel">0.5</span></label>
          <input type="range" id="blurRadiusSlider" min="0" max="10.0" step="0.1" value="0.5">
      </div>
      <div class="control-group">
          <label for="temporalStrengthSlider">Temporal Strength: <span id="temporalStrengthLabel">0.10</span></label>
          <input type="range" id="temporalStrengthSlider" min="0.0" max="10.0" step="0.2" value="0.0">
      </div>
      <div class="control-group">
          <label for="temporalDecaySlider">Temporal Decay: <span id="temporalDecayLabel">0.90</span></label>
          <input type="range" id="temporalDecaySlider" min="0.0" max="10.0" step="0.2" value="0.0">
      </div>
      <div class="control-group">
          <label for="edgeThresholdSlider">Edge Threshold: <span id="edgeThresholdLabel">0.10</span></label>
          <input type="range" id="edgeThresholdSlider" min="0.0" max="1.0" step="0.01" value="0.11">
      </div>
      <div class="control-group">
          <label for="edgeIntensitySlider">Edge Intensity: <span id="edgeIntensityLabel">0.8</span></label>
          <input type="range" id="edgeIntensitySlider" min="0.0" max="5.0" step="0.1" value="0.8">
      </div>
      <div class="control-group">
          <label for="normalEdgeStrengthSlider">Normal Edge Strength: <span id="normalEdgeStrengthLabel">1.0</span></label>
          <input type="range" id="normalEdgeStrengthSlider" min="0.0" max="2.0" step="0.1" value="0.1">
      </div>
      <div class="control-group">
          <label for="depthEdgeStrengthSlider">Depth Edge Strength: <span id="depthEdgeStrengthLabel">0.5</span></label>
          <input type="range" id="depthEdgeStrengthSlider" min="0.0" max="2.0" step="0.1" value="0.1">
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script type="x-shader/x-vertex" id="vertShader">
    // You typically link to external .glsl files, but if embedded, content goes here.
    // Example: #version 300 es (if using WebGL2)
    // precision highp float;
    // in vec3 aPosition;
    // in vec2 aTexCoord;
    // out vec2 vTexCoord;
    // void main() {
    //   vTexCoord = aTexCoord;
    //   gl_Position = vec4(aPosition, 1.0);
    // }
    // You load them via loadShader('vert.glsl', 'frag.glsl') in p5.js
  </script>
  <script type="x-shader/x-fragment" id="fragShader">
    // Similarly for fragment shader
  </script>

  <script src="sequenceData.js"></script>
  <script src="sequenceManager.js"></script>
  <script src="sketch.js"></script>

</body>
</html>
