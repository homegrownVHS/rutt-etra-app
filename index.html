<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas over Video (iOS Safe)</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
    }
    #videoFeed, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      pointer-events: none; /* Allow touches to pass through */
    }
    #log {
      position: absolute;
      bottom: 0;
      left: 0;
      color: white;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <video id="videoFeed" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="log">Waiting for camera...</div>

  <script>
    const video = document.getElementById("videoFeed");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("log");

    let frame = 0;

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;

        video.addEventListener("loadeddata", () => {
          log.textContent = "Video playing";

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw overlay
            ctx.fillStyle = "lime";
            ctx.font = "24px monospace";
            ctx.fillText("Frame " + frame++, 20, 40);

            requestAnimationFrame(drawLoop);
          }

          drawLoop();
        });
      })
      .catch(err => {
        log.textContent = "Camera error: " + err.message;
        console.error(err);
      });
  </script>

</body>
</html>
