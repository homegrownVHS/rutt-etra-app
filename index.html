<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0>
  <style> body {padding: 0; margin: 0;} </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <input type="file" id="vidInput" accept="video/*">
  <div id="sliders">
    <label for="depthSlider">Depth:</label>
    <input type="range" id="depthSlider" min="-200" max="200" value="50"><br>

    <label for="tiltXSlider">Tilt X:</label>
    <input type="range" id="tiltXSlider" min="-90" max="90" value="30"><br>

    <label for="tiltYSlider">Tilt Y:</label>
    <input type="range" id="tiltYSlider" min="-180" max="180" value="0"><br>

    <label for="scaleSlider">Scale:</label>
    <input type="range" id="scaleSlider" min="0.1" max="2" value="1" step="0.01"><br>

    <label for="densitySlider">Density:</label>
    <input type="range" id="densitySlider" min="1" max="20" value="6" step="1"><br>

    <label for="lfoDepth">LFO Depth:</label>
    <input type="checkbox" id="lfoDepth"><br>

    <label for="lfoTiltX">LFO Tilt X:</label>
    <input type="checkbox" id="lfoTiltX"><br>

    <label for="lfoTiltY">LFO Tilt Y:</label>
    <input type="checkbox" id="lfoTiltY"><br>

    <label for="lfoScale">LFO Scale:</label>
    <input type="checkbox" id="lfoScale"><br>

    <label for="lfoFreq">LFO Frequency:</label>
    <input type="range" id="lfoFreq" min="0.01" max="2" value="0.5" step="0.01"><br>

    <label for="lfoAmp">LFO Amplitude:</label>
    <input type="range" id="lfoAmp" min="0.1" max="100" value="20" step="0.1"><br>

    <label for="lfoType">LFO Type:</label>
    <select id="lfoType">
      <option value="sin">Sine</option>
      <option value="saw">Sawtooth</option>
      <option value="tri">Triangle</option>
    </select><br>

    <label for="gammaSlider">Gamma: <span id="gammaLabel">2.2</span></label>
    <input type="range" id="gammaSlider" min="0.1" max="5" value="2.2" step="0.1"><br>

    <button id="generateButton">Generate Processed Frames</button>
  </div>
</body>
</html>
