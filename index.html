<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Stream Diagnostic</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: monospace;
      color: white;
      text-align: center;
      touch-action: none;
    }
    video {
      width: 100vw;
      height: auto;
      z-index: 1;
      position: relative;
    }
    canvas {
      display: none; /* optional: test canvas later */
    }
    #log {
      padding: 1em;
      background: #111;
      font-size: 14px;
    }
    button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <h1>Live Video Feed Test</h1>
  <video id="videoFeed" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="log">Waiting for camera...</div>

  <script>
    const video = document.getElementById("videoFeed");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("log");

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
        video.play();

        video.addEventListener("loadeddata", () => {
          log.innerText = "Camera started. Live feed should be visible above.";

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          let frameCount = 0;

          function drawLoop() {
            // This will run even if canvas is hidden
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "lime";
            ctx.font = "20px monospace";
            ctx.fillText("Frame " + frameCount++, 10, 30);
            console.log("Canvas draw frame:", frameCount);
            requestAnimationFrame(drawLoop);
          }

          // Optional: run canvas test too
          // drawLoop();
        });
      })
      .catch(err => {
        log.innerText = "Camera error: " + err.message;
        console.error(err);
      });
  </script>

</body>
</html>
