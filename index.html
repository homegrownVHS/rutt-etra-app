<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutt-Etra Projected Color Mesh</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #videoFeed {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
    #log {
      position: absolute;
      bottom: 0;
      left: 0;
      color: white;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <video id="videoFeed" autoplay muted playsinline></video>
  <div id="log">Loading...</div>

  <script>
    let currentFacingMode = "user";
    let doubleTapTimeout = null;
    let lastTapTime = 0;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("videoFeed");
    const log = document.getElementById("log");

    let rotX = 0, rotY = 0, scale = 1, zScale = 80;
    let lastTouches = [];
    const step = 6;

    function rotatePoint(x, y, z) {
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

      let dy = y * cosX - z * sinX;
      let dz = y * sinX + z * cosX;

      let dx = x * cosY + dz * sinY;
      dz = -x * sinY + dz * cosY;

      return [dx * scale, dy * scale];
    }

    window.addEventListener("touchstart", e => { lastTouches = [...e.touches]; });
    window.addEventListener("touchend", e => { lastTouches = [...e.touches]; });
    window.addEventListener("touchmove", e => {
      e.preventDefault();
      const t = [...e.touches];
      if (t.length === 1 && lastTouches.length === 1) {
        rotY += (t[0].clientX - lastTouches[0].clientX) * 0.005;
        rotX -= (t[0].clientY - lastTouches[0].clientY) * 0.005;
      } else if (t.length === 2 && lastTouches.length === 2) {
        const avgY = d => (d[0].clientY + d[1].clientY) / 2;
        const dist = d => Math.hypot(d[0].clientX - d[1].clientX, d[0].clientY - d[1].clientY);
        const dy = avgY(t) - avgY(lastTouches);
        const dz = dist(t) - dist(lastTouches);
        zScale += -dy * 0.5;
        scale *= 1 + dz * 0.002;
        zScale = Math.max(-300, Math.min(zScale, 300));
      }
      lastTouches = t;
    }, { passive: false });

    navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } })
      .then(stream => {
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          // Double tap to toggle camera
          canvas.addEventListener('touchend', async (e) => {
            const now = Date.now();
            if (now - lastTapTime < 300) {
              if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
              }
              currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
              try {
                const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                video.srcObject = newStream;
              } catch (err) {
                console.error("Camera switch error:", err);
              }
            }
            lastTapTime = now;
          });

          canvas.height = video.videoHeight;
          log.textContent = "Touch mesh ready";
          setTimeout(() => log.style.display = 'none', 5000);

          function drawLoop() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;
            const w = canvas.width, h = canvas.height;

            ctx.clearRect(0, 0, w, h);
            ctx.lineWidth = 0.8;
            ctx.globalAlpha = 0.75;
            ctx.shadowBlur = 4;

            for (let y = 0; y < h; y += step) {
              const gradient = ctx.createLinearGradient(0, y, w, y);
              const points = [];

              for (let x = 0; x < w; x += step) {
                const i = (x + y * w) * 4;
                const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
                const bright = (r + g + b) / 3 / 255;
                const z = (bright - 0.5) * 2 * zScale;

                const [px, py] = rotatePoint(x - w / 2, y - h / 2, -z);
                const sx = px + w / 2;
                const sy = py + h / 2;

                points.push([sx, sy]);
                gradient.addColorStop(x / w, `rgba(${Math.min(255, r * 1.3)},${Math.min(255, g * 1.3)},${Math.min(255, b * 1.3)},0.9)`);
              }

              ctx.strokeStyle = gradient;
              ctx.shadowColor = gradient;
              ctx.beginPath();
              ctx.moveTo(points[0][0], points[0][1]);
              for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
              }
              ctx.stroke();
            }

            requestAnimationFrame(drawLoop);
          }

          drawLoop();
        });
      })
      .catch(err => {
        log.textContent = "Camera error: " + err.message;
        console.error(err);
      });
  </script>
</body>
</html>
