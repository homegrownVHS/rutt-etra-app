<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rutt-Etra Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    video#cameraFeed {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 160px;
      z-index: 5;
      background: black;
    }
    button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background-color: #222;
      color: white;
      z-index: 10;
    }
    #errorMsg {
      position: absolute;
      top: 60px;
      left: 20px;
      color: red;
      font-size: 16px;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>
  <video id="cameraFeed" autoplay muted playsinline></video>
  <div id="errorMsg"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
