<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rutt-Etra Live + MIDI</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      max-width: 1280px;
      width: 98vw;
    }
    #row1, #row2 {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      min-width: 150px;
      max-width: 220px;
    }
    label {
      margin-bottom: 4px;
    }
    input[type="range"],
    select,
    input[type="color"],
    input[type="file"] {
      width: 100%;
    }
    input[type="file"] {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px;
    }
    button {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 6px;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <main></main>

  <div id="controls">
    <div id="row1">
      <div class="control-group">
        <label for="camSelect">Camera Source</label>
        <select id="camSelect"></select>
      </div>

      <div class="control-group">
        <label>Depth Range <span id="depthLabel">0</span></label>
        <input type="range" id="depthSlider" min="-300" max="300" value="0">
        <label><input type="checkbox" id="lfoDepth"> LFO</label>
      </div>

      <div class="control-group">
        <label>Tilt Angle X <span id="tiltXLabel">0°</span></label>
        <input type="range" id="tiltXSlider" min="-180" max="180" value="0">
        <label><input type="checkbox" id="lfoTiltX"> LFO</label>
      </div>

      <div class="control-group">
        <label>Tilt Angle Y <span id="tiltYLabel">0°</span></label>
        <input type="range" id="tiltYSlider" min="-180" max="180" value="0">
        <label><input type="checkbox" id="lfoTiltY"> LFO</label>
      </div>

      <div class="control-group">
        <label>Scale <span id="scaleLabel">1.00</span></label>
        <input type="range" id="scaleSlider" min="0.5" max="3" step="0.1" value="1">
        <label><input type="checkbox" id="lfoScale"> LFO</label>
      </div>

      <div class="control-group">
        <label>Density <span id="densityLabel">6</span></label>
        <input type="range" id="densitySlider" min="2" max="40" value="6">
      </div>

      <div class="control-group">
        <label for="lineWidthSlider">Line Width: <span id="lineWidthLabel">0.48</span></label>
        <input type="range" id="lineWidthSlider" min="0.05" max="1" value="0.48" step="0.01">
      </div>

      <div class="control-group">
        <label for="gammaSlider">Gamma: <span id="gammaLabel">2.2</span></label>
        <input type="range" id="gammaSlider" min="0.1" max="5" value="2.2" step="0.1">
      </div>

      <div class="control-group">
        <label for="chromaSlider">Chroma Shift: <span id="chromaLabel">0.000</span></label>
        <input type="range" id="chromaSlider" min="0" max="0.05" value="0" step="0.001">
      </div>

      <div class="control-group">
        <label for="sheenSlider">3D Sheen: <span id="sheenLabel">0.00</span></label>
        <input type="range" id="sheenSlider" min="0" max="1.5" value="0" step="0.01">
      </div>

      <div class="control-group">
        <label for="contactSlider">Contact Shadow: <span id="contactLabel">0.00</span></label>
        <input type="range" id="contactSlider" min="0" max="1" value="0" step="0.01">
      </div>

      <div class="control-group">
        <label for="fogSlider">Depth Fog: <span id="fogLabel">0.00</span></label>
        <input type="range" id="fogSlider" min="0" max="1" value="0" step="0.01">
      </div>

      <div class="control-group">
        <label for="bloomSlider">Bloom: <span id="bloomLabel">0.00</span></label>
        <input type="range" id="bloomSlider" min="0" max="1.5" value="0" step="0.01">
      </div>

      <div class="control-group">
        <label for="paletteSelect">Color Palette:</label>
        <select id="paletteSelect">
          <option value="0">None</option>
          <option value="1">Phosphor Green</option>
          <option value="2">Thermal</option>
          <option value="3">Oscilloscope</option>
          <option value="4">Sepia</option>
          <option value="5">Rainbow</option>
        </select>
        <label for="paletteAmtSlider"> Amt: <span id="paletteAmtLabel">0.00</span></label>
        <input type="range" id="paletteAmtSlider" min="0" max="1" value="0" step="0.01">
      </div>

      <div class="control-group">
        <label for="scanModeSelect">Scan Mode:</label>
        <select id="scanModeSelect">
          <option value="H">Horizontal</option>
          <option value="V">Vertical</option>
          <option value="X">Both (Grid)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="depthSmoothSlider">Depth Smooth: <span id="depthSmoothLabel">0</span></label>
        <input type="range" id="depthSmoothSlider" min="0" max="2" value="0" step="0.1">
      </div>

      <div class="control-group">
        <label for="temporalSlider">Temporal Smooth: <span id="temporalLabel">1.00</span></label>
        <input type="range" id="temporalSlider" min="0.01" max="1" value="1" step="0.01">
      </div>
      <div class="control-group">
        <label for="shapeXSlider">Sphere H: <span id="shapeXLabel">0</span></label>
        <input type="range" id="shapeXSlider" min="0" max="100" value="0" step="1">
        <label><input type="checkbox" id="lfoShapeX"> LFO</label>
      </div>

      <div class="control-group">
        <label for="shapeYSlider">Sphere V: <span id="shapeYLabel">0</span></label>
        <input type="range" id="shapeYSlider" min="0" max="100" value="0" step="1">
        <label><input type="checkbox" id="lfoShapeY"> LFO</label>
      </div>

      <div class="control-group">
          <label for="waveAmpSlider">Wave Amplitude: <span id="waveAmpLabel">0.0</span></label>
          <input type="range" id="waveAmpSlider" min="-200" max="200" value="0" step="1">
          <label><input type="checkbox" id="lfoWaveAmp"> LFO</label>
      </div>
      <div class="control-group">
          <label for="waveFreqSlider">Wave Frequency: <span id="waveFreqLabel">0.0</span></label>
          <input type="range" id="waveFreqSlider" min="0" max="20" value="0" step="0.1">
          <label><input type="checkbox" id="lfoWaveFreq"> LFO</label>
      </div>

      <div class="control-group">
        <label for="horizAmpSlider">Horizontal Amp: <span id="horizAmpLabel">1.0</span></label>
        <input type="range" id="horizAmpSlider" min="0" max="2" value="1" step="0.01">
        <label><input type="checkbox" id="lfoHorizAmp"> LFO</label>
      </div>

      <div class="control-group">
        <label for="vertAmpSlider">Vertical Amp: <span id="vertAmpLabel">1.0</span></label>
        <input type="range" id="vertAmpSlider" min="0" max="2" value="1" step="0.01">
        <label><input type="checkbox" id="lfoVertAmp"> LFO</label>
      </div>

      <div class="control-group">
        <label for="offsetXSlider">Offset X: <span id="offsetXLabel">0</span></label>
        <input type="range" id="offsetXSlider" min="-300" max="300" value="0" step="1">
        <label><input type="checkbox" id="lfoOffsetX"> LFO</label>
      </div>

      <div class="control-group">
        <label for="offsetYSlider">Offset Y: <span id="offsetYLabel">0</span></label>
        <input type="range" id="offsetYSlider" min="-300" max="300" value="0" step="1">
        <label><input type="checkbox" id="lfoOffsetY"> LFO</label>
      </div>

      <div class="control-group">
        <label for="fovSlider">Perspective FOV: <span id="fovLabel">0°</span></label>
        <input type="range" id="fovSlider" min="0" max="90" value="0" step="1">
      </div>

      <div class="control-group">
        <label for="lightAmtSlider">Surface Light: <span id="lightAmtLabel">0.00</span></label>
        <input type="range" id="lightAmtSlider" min="0" max="1" value="0" step="0.01">
        <label for="lightAzSlider">Azimuth: <span id="lightAzLabel">45°</span></label>
        <input type="range" id="lightAzSlider" min="-180" max="180" value="45" step="1">
        <label for="lightElSlider">Elevation: <span id="lightElLabel">45°</span></label>
        <input type="range" id="lightElSlider" min="0" max="90" value="45" step="1">
      </div>

    </div>

    <div id="row2">
      <div class="control-group">
        <label>LFO Type</label>
        <select id="lfoType">
          <option value="saw">Sawtooth</option>
          <option value="sin">Sine</option>
          <option value="tri">Triangle</option>
        </select>
      </div>

      <div class="control-group">
        <label>LFO Freq</label>
        <input type="range" id="lfoFreq" min="0.01" max="2" step="0.01" value="0.3">
      </div>

      <div class="control-group">
        <label>LFO Amp</label>
        <input type="range" id="lfoAmp" min="0" max="1" step="0.01" value="0.5">
      </div>

      <div class="control-group">
        <label>Upload Image</label>
        <input type="file" id="imgInput" accept="image/*">
      </div>
      <div class="control-group">
        <label>Upload Video</label>
        <input type="file" id="vidInput" accept="video/*">
      </div>
      <div class="control-group" id="videoControls" style="display:none">
        <button id="vidPlayPauseBtn">⏸</button>
        <label><input type="checkbox" id="vidLoopChk" checked> Loop</label>
        <span id="vidTimeLabel" style="font-size:0.85em;min-width:7ch">0:00 / 0:00</span>
      </div>
      <div class="control-group" id="videoScrubGroup" style="display:none">
        <input type="range" id="vidScrubber" min="0" max="1000" value="0" step="1" style="width:100%">
      </div>
      <div class="control-group">
        <button id="resetParamsBtn">Reset Params</button>
        <button id="downloadBtn">Download Image</button>
      </div>

      <div class="control-group">
        <label for="totalFramesForExportInput">Total Export Frames</label>
        <input type="number" id="totalFramesForExportInput" value="100" min="1" max="9999">
      </div>
      <div class="control-group">
        <button id="startExportBtn">Start Export</button>
      </div>
      <div class="control-group">
        <button id="nextFrameBtn">Next Frame</button>
        <label>Current Frame: <span id="currentFrameLabel">0</span></label>
      </div>

      <input type="hidden" id="currentFrameForExportInput" value="0">

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
