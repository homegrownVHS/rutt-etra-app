<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iOS Video + Touch Test</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    video#videoFeed {
      position: fixed;
      top: 100vh;
      left: 100vw;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      z-index: -1;
    }
    #startBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 16px;
      font-size: 16px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Camera</button>
  <video id="videoFeed" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById("videoFeed");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");

    let streaming = false;
    let touches = [];

    startBtn.onclick = () => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          video.play(); // ✅ Force playback attempt

          const handleStreamReady = () => {
            if (streaming) return;
            streaming = true;
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            drawLoop();
            startBtn.remove();
          };

          video.addEventListener("canplay", handleStreamReady, { once: true });
          video.addEventListener("loadeddata", handleStreamReady, { once: true });

          // ⏱ fallback in case neither fires
          setTimeout(() => {
            if (!streaming) handleStreamReady();
          }, 2000);
        })
        .catch(err => {
          alert("Camera error: " + err.message);
        });
    };

    function drawLoop() {
      if (streaming) {
        if (video.paused) video.play();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Draw touch feedback
        for (let t of touches) {
          ctx.beginPath();
          ctx.fillStyle = touches.length === 1 ? "lime" : "red";
          ctx.arc(t.clientX, t.clientY, 25, 0, Math.PI * 2);
          ctx.fill();
        }

        if (touches.length === 2) {
          ctx.fillStyle = "red";
          ctx.font = "24px monospace";
          ctx.fillText("Pinch Detected", 30, 30);
        }

        requestAnimationFrame(drawLoop);
      }
    }

    window.addEventListener("touchstart", e => {
      e.preventDefault();
      touches = [...e.touches];
    }, { passive: false });

    window.addEventListener("touchmove", e => {
      e.preventDefault();
      touches = [...e.touches];
    }, { passive: false });

    window.addEventListener("touchend", e => {
      e.preventDefault();
      touches = [...e.touches];
    }, { passive: false });
  </script>
</body>
</html>
