<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Diagnostic</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      touch-action: none;
      text-align: center;
    }
    video {
      width: 100vw;
      max-height: 60vh;
      background: #222;
    }
    button {
      margin: 1em;
      padding: 1em 2em;
      font-size: 18px;
    }
    #log {
      margin-top: 1em;
      padding: 0 1em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Camera Diagnostic</h1>
  <button id="startBtn">Start Camera</button>
  <video id="videoFeed" autoplay muted playsinline></video>
  <div id="log">Waiting...</div>

  <script>
    const btn = document.getElementById("startBtn");
    const video = document.getElementById("videoFeed");
    const log = document.getElementById("log");

    function logStatus(msg) {
      console.log(msg);
      log.textContent = msg;
    }

    btn.onclick = () => {
      logStatus("Pressed Start Camera");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        logStatus("getUserMedia not supported in this browser.");
        return;
      }

      logStatus("Requesting camera access...");

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          logStatus("Camera access granted. Playing stream...");
          video.srcObject = stream;
          video.play();
        })
        .catch(err => {
          logStatus("Camera error: " + err.message);
          console.error("getUserMedia error:", err);
        });
    };
  </script>

</body>
</html>
