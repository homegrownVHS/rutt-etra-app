<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 24px;
      touch-action: none;
    }
    #log {
      padding: 2em;
    }
  </style>
</head>
<body>
  <div id="log">Touch me.</div>

  <script>
    const log = document.getElementById("log");

    window.addEventListener("touchstart", e => {
      e.preventDefault();
      log.innerText = `touchstart: ${e.touches.length} fingers`;
    }, { passive: false });

    window.addEventListener("touchmove", e => {
      e.preventDefault();
      log.innerText = `touchmove: ${e.touches.length} fingers`;
    }, { passive: false });

    window.addEventListener("touchend", e => {
      e.preventDefault();
      log.innerText = `touchend`;
    }, { passive: false });
  </script>
</body>
</html>
