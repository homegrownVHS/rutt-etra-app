<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rutt-Etra Live + MIDI</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }
    canvas { display: block; }
    main { width: 100vw; height: 100vh; overflow: hidden; }

    /* ── Overlay panel ─────────────────────────────────────────────── */
    #controls {
      position: fixed;
      top: 0; right: 0;
      width: 270px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(0,0,0,0.88);
      padding: 10px 12px 24px;
      box-sizing: border-box;
      z-index: 100;
      transition: transform 0.22s ease;
      font-size: 12px;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    #controls.hidden { transform: translateX(274px); }
    #controls::-webkit-scrollbar { width: 4px; }
    #controls::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .ctrl-section {
      border-top: 1px solid #333;
      margin: 10px 0 6px;
      padding-top: 5px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 7px;
    }
    .control-group label { margin-bottom: 2px; color: #ccc; }
    .control-group label.sub { color: #888; font-size: 11px; margin-top: 3px; }
    input[type="range"] { width: 100%; accent-color: #0af; cursor: pointer; }
    select {
      width: 100%;
      background: #222; color: #fff;
      border: 1px solid #444; border-radius: 3px;
      padding: 3px 4px;
    }
    input[type="file"] {
      background: #222; color: #aaa;
      border: 1px solid #444; border-radius: 3px;
      padding: 3px; width: 100%; font-size: 11px;
    }
    button {
      background: #2a2a2a; color: #fff;
      border: 1px solid #444; border-radius: 3px;
      padding: 5px 10px; cursor: pointer;
      font-size: 12px; margin-top: 4px; width: 100%;
    }
    button:hover { background: #444; }
    .row2col { display: flex; gap: 6px; }
    .row2col button { flex: 1; }
    #_toggleHint {
      position: fixed; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: #444;
      pointer-events: none; z-index: 99;
    }
  </style>
</head>
<body>
  <main></main>

  <div id="controls">

    <!-- SOURCE -->
    <div class="ctrl-section">Source</div>
    <div class="control-group">
      <label for="camSelect">Camera</label>
      <select id="camSelect"></select>
    </div>
    <div class="control-group">
      <label>Upload Media</label>
      <input type="file" id="mediaInput" accept="image/*,video/*">
    </div>
    <div class="control-group">
      <button id="tabCaptureBtn">Capture Tab / Screen</button>
    </div>
    <div class="control-group" id="videoControls" style="display:none">
      <button id="vidPlayPauseBtn">&#9658;</button>
      <label><input type="checkbox" id="vidLoopChk" checked> Loop</label>
      <span id="vidTimeLabel" style="font-size:11px">0:00 / 0:00</span>
    </div>
    <div class="control-group" id="videoScrubGroup" style="display:none">
      <input type="range" id="vidScrubber" min="0" max="1000" value="0" step="1">
    </div>

    <!-- GEOMETRY -->
    <div class="ctrl-section">Geometry</div>
    <div class="control-group">
      <label>Depth <span id="depthLabel">0</span></label>
      <input type="range" id="depthSlider" min="-300" max="300" value="0">
      <label class="sub"><input type="checkbox" id="lfoDepth"> LFO</label>
    </div>
    <div class="control-group">
      <label>Depth Floor <span id="depthMinLabel">0%</span></label>
      <input type="range" id="depthMinSlider" min="0" max="100" value="0" step="1">
    </div>
    <div class="control-group">
      <label>Depth Ceiling <span id="depthMaxLabel">100%</span></label>
      <input type="range" id="depthMaxSlider" min="0" max="100" value="100" step="1">
    </div>
    <div class="control-group">
      <label><input type="checkbox" id="invertDepthChk"> Invert Depth</label>
    </div>
    <div class="control-group">
      <label>Tilt X <span id="tiltXLabel">0°</span></label>
      <input type="range" id="tiltXSlider" min="-180" max="180" value="0">
      <label class="sub"><input type="checkbox" id="lfoTiltX"> LFO</label>
    </div>
    <div class="control-group">
      <label>Tilt Y <span id="tiltYLabel">0°</span></label>
      <input type="range" id="tiltYSlider" min="-180" max="180" value="0">
      <label class="sub"><input type="checkbox" id="lfoTiltY"> LFO</label>
    </div>
    <div class="control-group">
      <label>Scale <span id="scaleLabel">1.00</span></label>
      <input type="range" id="scaleSlider" min="0.5" max="3" step="0.1" value="1">
      <label class="sub"><input type="checkbox" id="lfoScale"> LFO</label>
    </div>
    <div class="control-group">
      <label>Density <span id="densityLabel">6</span></label>
      <input type="range" id="densitySlider" min="2" max="40" value="6">
    </div>
    <div class="control-group">
      <label>Line Width <span id="lineWidthLabel">0.48</span></label>
      <input type="range" id="lineWidthSlider" min="0.05" max="1" value="0.48" step="0.01">
    </div>
    <div class="control-group">
      <label>Scan Mode</label>
      <select id="scanModeSelect">
        <option value="H">Horizontal</option>
        <option value="V">Vertical</option>
        <option value="X">Both (Grid)</option>
        <option value="P">Polar (Radial)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Perspective FOV <span id="fovLabel">0°</span></label>
      <input type="range" id="fovSlider" min="0" max="90" value="0" step="1">
    </div>
    <div class="control-group">
      <label>Horiz Amp <span id="horizAmpLabel">1.0</span></label>
      <input type="range" id="horizAmpSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub"><input type="checkbox" id="lfoHorizAmp"> LFO</label>
    </div>
    <div class="control-group">
      <label>Vert Amp <span id="vertAmpLabel">1.0</span></label>
      <input type="range" id="vertAmpSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub"><input type="checkbox" id="lfoVertAmp"> LFO</label>
    </div>
    <div class="control-group">
      <label>Offset X <span id="offsetXLabel">0</span></label>
      <input type="range" id="offsetXSlider" min="-300" max="300" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoOffsetX"> LFO</label>
    </div>
    <div class="control-group">
      <label>Offset Y <span id="offsetYLabel">0</span></label>
      <input type="range" id="offsetYSlider" min="-300" max="300" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoOffsetY"> LFO</label>
    </div>

    <!-- SHAPE -->
    <div class="ctrl-section">Shape</div>
    <div class="control-group">
      <label>Sphere H <span id="shapeXLabel">0</span></label>
      <input type="range" id="shapeXSlider" min="-100" max="100" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoShapeX"> LFO</label>
    </div>
    <div class="control-group">
      <label>Sphere V <span id="shapeYLabel">0</span></label>
      <input type="range" id="shapeYSlider" min="-100" max="100" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoShapeY"> LFO</label>
    </div>
    <div class="control-group">
      <label>Wave Amp <span id="waveAmpLabel">0.0</span></label>
      <input type="range" id="waveAmpSlider" min="-200" max="200" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoWaveAmp"> LFO</label>
    </div>
    <div class="control-group">
      <label>Wave Freq X <span id="waveFreqXLabel">0.0</span></label>
      <input type="range" id="waveFreqXSlider" min="0" max="20" value="0" step="0.1">
      <label class="sub"><input type="checkbox" id="lfoWaveFreqX"> LFO</label>
    </div>
    <div class="control-group">
      <label>Wave Freq Y <span id="waveFreqYLabel">0.0</span></label>
      <input type="range" id="waveFreqYSlider" min="0" max="20" value="0" step="0.1">
      <label class="sub"><input type="checkbox" id="lfoWaveFreqY"> LFO</label>
    </div>

    <!-- COLOR -->
    <div class="ctrl-section">Color</div>
    <div class="control-group">
      <label>Gamma <span id="gammaLabel">2.2</span></label>
      <input type="range" id="gammaSlider" min="0.1" max="5" value="2.2" step="0.1">
    </div>
    <div class="control-group">
      <label>Chroma Shift <span id="chromaLabel">0.000</span></label>
      <input type="range" id="chromaSlider" min="0" max="0.05" value="0" step="0.001">
    </div>
    <div class="control-group">
      <label>Hue Shift <span id="hueShiftLabel">0°</span></label>
      <input type="range" id="hueShiftSlider" min="-180" max="180" value="0" step="1">
      <label class="sub"><input type="checkbox" id="lfoHueShift"> LFO</label>
    </div>
    <div class="control-group">
      <label>Saturation <span id="satLabel">1.00</span></label>
      <input type="range" id="satSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub"><input type="checkbox" id="lfoSat"> LFO</label>
    </div>
    <div class="control-group">
      <label>Depth Colorize <span id="depthColorizeLabel">0.00</span></label>
      <input type="range" id="depthColorizeSlider" min="0" max="1" value="0" step="0.01">
    </div>
    <div class="control-group">
      <label>Colorize Palette</label>
      <select id="depthColorPaletteSelect">
        <option value="0">Spectrum (blue→red)</option>
        <option value="1">Heat (black→white)</option>
        <option value="2">Neon (purple→cyan)</option>
      </select>
    </div>

    <!-- FX -->
    <div class="ctrl-section">FX</div>
    <div class="control-group">
      <label>3D Sheen <span id="sheenLabel">0.00</span></label>
      <input type="range" id="sheenSlider" min="0" max="1.5" value="0" step="0.01">
    </div>
    <div class="control-group">
      <label>Contact Shadow <span id="contactLabel">0.00</span></label>
      <input type="range" id="contactSlider" min="0" max="1" value="0" step="0.01">
    </div>
    <div class="control-group">
      <label>Depth Fog <span id="fogLabel">0.00</span></label>
      <input type="range" id="fogSlider" min="0" max="1" value="0" step="0.01">
      <label class="sub"><input type="checkbox" id="fogInvertChk"> Invert (darken raised)</label>
    </div>
    <div class="control-group">
      <label>Depth Smooth <span id="depthSmoothLabel">0.0</span></label>
      <input type="range" id="depthSmoothSlider" min="0" max="2" value="0" step="0.1">
      <label class="sub"><input type="checkbox" id="colorSmoothChk"> Apply to Color</label>
    </div>
    <div class="control-group">
      <label>Temporal Smooth <span id="temporalLabel">1.00</span></label>
      <input type="range" id="temporalSlider" min="0.01" max="1" value="1" step="0.01">
    </div>
    <div class="control-group">
      <label>Bloom <span id="bloomLabel">0.00</span></label>
      <input type="range" id="bloomSlider" min="0" max="1.5" value="0" step="0.01">
    </div>
    <div class="control-group">
      <label>Surface Light <span id="lightAmtLabel">0.00</span></label>
      <input type="range" id="lightAmtSlider" min="0" max="1" value="0" step="0.01">
      <label class="sub">Azimuth <span id="lightAzLabel">45°</span></label>
      <input type="range" id="lightAzSlider" min="-180" max="180" value="45" step="1">
      <label class="sub">Elevation <span id="lightElLabel">45°</span></label>
      <input type="range" id="lightElSlider" min="0" max="90" value="45" step="1">
    </div>

    <!-- LFO -->
    <div class="ctrl-section">LFO</div>
    <div class="control-group">
      <label>Type</label>
      <select id="lfoType">
        <option value="saw">Sawtooth</option>
        <option value="sin">Sine</option>
        <option value="tri">Triangle</option>
      </select>
    </div>
    <div class="control-group">
      <label>Frequency</label>
      <input type="range" id="lfoFreq" min="0.01" max="2" step="0.01" value="0.3">
    </div>
    <div class="control-group">
      <label>Amplitude</label>
      <input type="range" id="lfoAmp" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div class="control-group">
      <label>Phase Offset <span id="lfoPhaseOffsetLabel">0°</span></label>
      <input type="range" id="lfoPhaseOffsetSlider" min="0" max="360" value="0" step="1">
    </div>

    <!-- AUDIO -->
    <div class="ctrl-section">Audio Reactivity</div>
    <div class="control-group row2col">
      <select id="audioSourceSelect">
        <option value="loopback">System Loopback</option>
        <option value="mic">Microphone</option>
      </select>
      <button id="audioStartBtn">Start</button>
    </div>
    <div class="control-group" id="audioMeterGroup" style="opacity:0.4">
      <label id="audioMeterLabel" style="font-family:monospace;letter-spacing:3px">B▁ M▁ T▁</label>
    </div>
    <div class="control-group">
      <label>Bass drives</label>
      <select id="audioBassTargetSelect">
        <option value="none">— Off —</option>
        <option value="depth">Depth</option>
        <option value="waveAmp">Wave Amp</option>
        <option value="shapeX">Sphere H</option>
        <option value="shapeY">Sphere V</option>
        <option value="hueShift">Hue Shift</option>
        <option value="sat">Saturation</option>
        <option value="scale">Scale</option>
        <option value="fog">Fog</option>
        <option value="chroma">Chroma Shift</option>
      </select>
      <label class="sub">Amt <span id="audioBassAmtLabel">1.00</span></label>
      <input type="range" id="audioBassAmtSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub">Sens <span id="audioBassSensLabel">5.0</span></label>
      <input type="range" id="audioBassSens" min="1" max="20" value="5" step="0.5">
      <label class="sub">Smooth <span id="audioBassSmthLabel">0.80</span></label>
      <input type="range" id="audioBassSmooth" min="0" max="0.99" value="0.8" step="0.01">
    </div>
    <div class="control-group">
      <label>Mid drives</label>
      <select id="audioMidTargetSelect">
        <option value="none">— Off —</option>
        <option value="depth">Depth</option>
        <option value="waveAmp">Wave Amp</option>
        <option value="shapeX">Sphere H</option>
        <option value="shapeY">Sphere V</option>
        <option value="hueShift">Hue Shift</option>
        <option value="sat">Saturation</option>
        <option value="scale">Scale</option>
        <option value="fog">Fog</option>
        <option value="chroma">Chroma Shift</option>
      </select>
      <label class="sub">Amt <span id="audioMidAmtLabel">1.00</span></label>
      <input type="range" id="audioMidAmtSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub">Sens <span id="audioMidSensLabel">5.0</span></label>
      <input type="range" id="audioMidSens" min="1" max="20" value="5" step="0.5">
      <label class="sub">Smooth <span id="audioMidSmthLabel">0.80</span></label>
      <input type="range" id="audioMidSmooth" min="0" max="0.99" value="0.8" step="0.01">
    </div>
    <div class="control-group">
      <label>Treble drives</label>
      <select id="audioTrebleTargetSelect">
        <option value="none">— Off —</option>
        <option value="depth">Depth</option>
        <option value="waveAmp">Wave Amp</option>
        <option value="shapeX">Sphere H</option>
        <option value="shapeY">Sphere V</option>
        <option value="hueShift">Hue Shift</option>
        <option value="sat">Saturation</option>
        <option value="scale">Scale</option>
        <option value="fog">Fog</option>
        <option value="chroma">Chroma Shift</option>
      </select>
      <label class="sub">Amt <span id="audioTrebleAmtLabel">1.00</span></label>
      <input type="range" id="audioTrebleAmtSlider" min="0" max="2" value="1" step="0.01">
      <label class="sub">Sens <span id="audioTrebleSensLabel">5.0</span></label>
      <input type="range" id="audioTrebleSens" min="1" max="20" value="5" step="0.5">
      <label class="sub">Smooth <span id="audioTrebleSmthLabel">0.80</span></label>
      <input type="range" id="audioTrebleSmooth" min="0" max="0.99" value="0.8" step="0.01">
    </div>

    <!-- UTILITY -->
    <div class="ctrl-section">Utility</div>
    <div class="control-group row2col">
      <button id="resetParamsBtn">Reset</button>
      <button id="downloadBtn">Download</button>
    </div>

    <input type="hidden" id="currentFrameForExportInput" value="0">
  </div>

  <div id="_toggleHint">Shift+Enter — toggle controls</div>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
  <script>
    // Shift+Enter toggles the overlay panel
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.shiftKey) {
        document.getElementById('controls').classList.toggle('hidden');
        e.preventDefault();
      }
    });

    // Double-click a slider label to reset to default
    document.querySelectorAll('input[type="range"]').forEach(slider => {
      const def = slider.defaultValue;
      let label = slider.id ? document.querySelector('label[for="' + slider.id + '"]') : null;
      if (!label) {
        let el = slider.previousElementSibling;
        while (el) { if (el.tagName === 'LABEL') { label = el; break; } el = el.previousElementSibling; }
      }
      if (label) {
        label.style.cursor = 'pointer';
        label.title = 'Double-click to reset';
        label.addEventListener('dblclick', () => {
          slider.value = def;
          slider.dispatchEvent(new Event('input', { bubbles: true }));
        });
      }
    });
  </script>
</body>
</html>
