<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Mesh Over Video</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
    }
    #videoFeed, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      pointer-events: none;
    }
    #log {
      position: absolute;
      bottom: 0;
      left: 0;
      color: white;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <video id="videoFeed" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="log">Waiting for camera...</div>

  <script>
    const video = document.getElementById("videoFeed");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("log");

    const step = 6;     // Pixel sampling interval
    const zScale = 80;  // Brightness → depth

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;

        video.addEventListener("loadeddata", () => {
          log.textContent = "Drawing line mesh...";

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw video to offscreen canvas to access pixels
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;

            // Clear canvas for drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;

            for (let y = 0; y < canvas.height; y += step) {
              ctx.beginPath();
              for (let x = 0; x < canvas.width; x += step) {
                const i = (x + y * canvas.width) * 4;
                const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
                const brightness = (r + g + b) / 3 / 255;
                const z = (1 - brightness) * zScale;

                ctx.strokeStyle = `rgb(${r},${g},${b})`;
                ctx.lineTo(x, y - z);
              }
              ctx.stroke();
            }

            requestAnimationFrame(drawLoop);
          }

          drawLoop();
        });
      })
      .catch(err => {
        log.textContent = "Camera error: " + err.message;
        console.error(err);
      });
  </script>

</body>
</html>
