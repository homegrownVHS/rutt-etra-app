<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Draw Test</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      text-align: center;
      touch-action: none;
    }
    video {
      display: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: auto;
    }
    #log {
      margin-top: 1em;
    }
  </style>
</head>
<body>

  <h1>Canvas + Camera Test</h1>
  <video id="videoFeed" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="log">Waiting for video...</div>

  <script>
    const video = document.getElementById("videoFeed");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("log");

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
        video.onloadeddata = () => {
          log.textContent = "Video loaded. Starting canvas draw...";

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          let frameCount = 0;

          function drawLoop() {
            if (video.readyState >= 2) {
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

              // ✅ Frame counter overlay
              ctx.fillStyle = "rgba(0,255,0,0.5)";
              ctx.font = "20px monospace";
              ctx.fillText("Frame " + frameCount++, 10, 30);
            }
            requestAnimationFrame(drawLoop);
          }

          drawLoop();
        };
      })
      .catch(err => {
        log.textContent = "Camera error: " + err.message;
        console.error(err);
      });
  </script>

</body>
</html>
